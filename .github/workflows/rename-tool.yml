name: Rename Tool
run-name: Rename ${{ inputs.oldToolName }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      oldToolName:
        description: 'Old Tool Name'
        type: string
        required: true
      newToolName:
        description: 'New Tool Name'
        type: string
        required: true

jobs:
  rename-tool:
    runs-on: ubuntu-latest
    env:
      OLD_TOOL_NAME: ${{ inputs.oldToolName }}
      NEW_TOOL_NAME: ${{ inputs.newToolName }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Rename tool
        id: rename-tool
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          GITBOOK_API_TOKEN: ${{ secrets.GITBOOK_API_TOKEN }}
        run: |
          node src/rename_tool.mjs "$OLD_TOOL_NAME" "$NEW_TOOL_NAME"
          if [ -n "$(git status gitbook --porcelain)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes ${{ steps.rename-tool.outputs.changes }}
        if: ${{ steps.rename-tool.outputs.changes == 'true' }}
        run: |
          git status --porcelain
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gitbook
          git commit -m "Rename '$OLD_TOOL_NAME' to '$NEW_TOOL_NAME'"

      - name: Push changes
        if: ${{ steps.rename-tool.outputs.changes == 'true' }}
        uses: ad-m/github-push-action@master
        with:
          branch: main

      # Runs last, and independently of `changes`: the tool's ID has already
      # been updated in the GitHub Project, so a Sheets failure here must not
      # strand the rename uncommitted. Renaming the ID in place keeps each
      # tool's existing sheet row (and anything hand-entered on it) instead of
      # letting the next sync append a new row and prune the old one.
      - name: Update Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          OLD_SLUG: ${{ steps.rename-tool.outputs.oldSlug }}
          NEW_SLUG: ${{ steps.rename-tool.outputs.newSlug }}
        run: node src/sheet-rename.mjs "$OLD_SLUG" "$NEW_SLUG"
